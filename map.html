<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MeetPoint Map</title>


    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css" />


    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />

    <style>

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        #memberPanel {

            position: absolute;
            top: 20px;
            left: 20px;

            z-index: 1000;

            width: 280px;

            background: rgba(20, 20, 30, 0.9);

            backdrop-filter: blur(10px);

            border-radius: 15px;

            padding: 15px;

            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.4);

        }

        #memberSearch {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 10px;

            outline: none;

            font-size: 14px;

            box-sizing: border-box;

            background: rgba(255,255,255,0.1);

            color: white;

        }

        #memberSearch::placeholder {

            color: #cccccc;

        }

        #memberList {

            margin-top: 12px;

            max-height: 250px;

            overflow-y: auto;

        }

        .memberItem {

            background: rgba(255,255,255,0.08);

            color: white;

            padding: 10px;

            margin-bottom: 8px;

            border-radius: 10px;

            cursor: pointer;

            transition: 0.3s;

        }

        .memberItem:hover {

            background: rgba(0,255,255,0.25);

        }

        .panelTitle {

            color: cyan;

            text-align: center;

            margin-bottom: 12px;

            font-weight: bold;

            font-size: 18px;

        }

    </style>

</head>

<body>


    <div id="memberPanel">

    

        <div id="reachedCounter"
        style="
        color:white;
        text-align:center;
        font-weight:bold;
        margin-bottom:10px;
        padding:10px;
        background:rgba(0,255,0,0.15);
        border-radius:10px;
        ">
        👥 0 / 0 Reached
        </div>

        <div class="panelTitle">
            👥 Members
        </div>

        <input
            type="text"
            id="memberSearch"
            placeholder="🔍 Search Member">

        <div id="memberList"></div>

    </div>

    <div id="map"></div>

    <div id="topStats">

    <div class="statBox">
        👥 <span id="totalMembers">0</span>
    </div>

    <div class="statBox">
        ✅ <span id="reachedCountTop">0</span>
    </div>

    <div class="statBox">
        🚗 <span id="travellingCount">0</span>
    </div>

</div>

<div id="memberPanel">

    <div id="reachedCounter">
        👥 0 / 0 Reached
    </div>

    <div class="panelTitle">
        👥 Members
    </div>

    <input
        type="text"
        id="memberSearch"
        placeholder="🔍 Search Member">

    <div id="memberList"></div>

</div>

<div id="map"></div>

    <button
    id="themeToggleBtn"
   >
    🌙 Dark Map
    </button>

    <button id="themeIconBtn">
    🌓
    </button>

    <script
        src="https://unpkg.com/leaflet/dist/leaflet.js">
    </script>

    <script
        src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js">
    </script>

    <script
        type="module"
        src="../js/map.js">
    </script>

</body>

</html>
