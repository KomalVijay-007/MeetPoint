<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetPoint</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="hud-bg">

        <div class="reactor-core"></div>

        <div class="pulse-ring pulse1"></div>
        <div class="pulse-ring pulse2"></div>
        <div class="pulse-ring pulse3"></div>




    </div>

    <div class="main-content">

        <div class="glass-card">

            <h1>📍 MeetPoint</h1>

            <p class="tagline">
                Same destination.<br>
                Better coordination.
            </p>

            <p class="description">
                Coordinate group meetups with live tracking,
                arrival updates and nearby place discovery.
            </p>

            <div class="buttons">

                <a href="create.html">
                    <button class="btn">
                        Create Meetup
                    </button>
                </a>

                <a href="join.html">
                    <button class="btn secondary">
                        Join Meetup
                    </button>
                </a>

            </div>

        </div>

    </div>

</body>
</html>
