<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        MeetPoint Dashboard
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>

<body>

    <div class="hud-bg">

        <div class="reactor-core"></div>

        <div class="pulse-ring pulse1"></div>
        <div class="pulse-ring pulse2"></div>
        <div class="pulse-ring pulse3"></div>

    </div>

    <div class="main-content">

        <div class="glass-card">

            <h1 class="dashboard-title">
                MEETPOINT HUB
            </h1>

            <p class="dashboard-subtitle">
                FUTURE MEETUP SYSTEM
            </p>

            <div id="dashboardContent"></div>

            <div id="locationStatus"></div>

            <div id="membersList"></div>

            <div id="mapContainer">

            

            </div>

            <div class="dashboard-buttons">

                <button
                    class="btn"
                    id="startJourneyBtn">

                    ▶ Start Journey

                </button>

                <button
                    class="btn secondary"
                    id="shareLocationBtn">

                    📍 Share Location

                </button>


            </div>

        </div>

    </div>

    <script
        type="module"
        src="../js/dashboard.js">
    </script>

</body>

</html>
